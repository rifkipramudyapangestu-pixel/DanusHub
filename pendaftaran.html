<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanusHub - Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>DanusHub</h1>
                <p>Dashboard Penjual Dana Usaha</p>
            </div>

            <h2>Pendaftaran Penjual</h2>

            <form action="dashboard.html">
                <label for="nama-penanggung-jawab">Nama Penanggung Jawab</label>
                <input type="text" id="nama-penanggung-jawab" name="nama-penanggung-jawab" placeholder="Masukkan nama lengkap" required>

                <label for="nama-ormawa">Nama Ormawa atau UKM</label>
                <input type="text" id="nama-ormawa" name="nama-ormawa" placeholder="Masukkan nama organisasi" required>

                <label for="nomor-whatsapp">Nomor WhatsApp</label>
                <input type="tel" id="nomor-whatsapp" name="nomor-whatsapp" placeholder="Contoh: 081234567890" required>

                <label for="email-pendaftaran">Email</label>
                <input type="email" id="email-pendaftaran" name="email-pendaftaran" placeholder="Masukkan email" required>

                <label for="password-pendaftaran">Password</label>
                <input type="password" id="password-pendaftaran" name="password-pendaftaran" placeholder="Minimal 8 karakter" required>

                <label for="konfirmasi-password">Konfirmasi Password</label>
                <input type="password" id="konfirmasi-password" name="konfirmasi-password" placeholder="Ulangi password" required>

                <div class="auth-buttons">
                    <button type="submit">Daftar</button>
                    <button type="reset">Reset</button>
                </div>
            </form>

            <p class="auth-link">Sudah memiliki akun? <a href="login.html">Login sekarang</a></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 DanusHub. Dashboard Penjual Dana Usaha Mahasiswa.</p>
    </footer>

</body>
</html>
