<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanusHub - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>DanusHub</h1>
                <p>Dashboard Penjual Dana Usaha</p>
            </div>

            <h2>Login Penjual</h2>

            <form action="dashboard.html">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" name="login-email" placeholder="Masukkan email" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="login-password" placeholder="Masukkan password" required>

                <button type="submit">Masuk</button>
            </form>

            <p class="auth-link">Belum memiliki akun? <a href="pendaftaran.html">Daftar sebagai penjual</a></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 DanusHub. Dashboard Penjual Dana Usaha Mahasiswa.</p>
    </footer>

</body>
</html>
