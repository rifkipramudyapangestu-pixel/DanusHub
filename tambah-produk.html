<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanusHub - Tambah Produk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <h1>DanusHub</h1>
        <p>Dashboard Penjual Dana Usaha</p>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <h2>DanusHub</h2>
            <nav>
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="produk.html" class="active">Produk</a></li>
                    <li><a href="pesanan.html">Pesanan</a></li>
                    <li><a href="stok.html">Manajemen Stok</a></li>
                    <li><a href="laporan.html">Laporan</a></li>
                    <li><a href="pembayaran.html">Pembayaran</a></li>
                    <li><a href="profil.html">Profil</a></li>
                </ul>
            </nav>
            <a href="login.html">Keluar</a>
        </aside>

        <main class="main-content">
            <section class="content-section">
                <h2>Tambah Produk</h2>
                <form>
                    <label for="foto">Foto Produk</label>
                    <input type="file" id="foto" name="foto">

                    <label for="nama-produk">Nama Produk</label>
                    <input type="text" id="nama-produk" name="nama-produk" placeholder="Masukkan nama produk" required>

                    <label for="harga">Harga</label>
                    <input type="number" id="harga" name="harga" placeholder="Masukkan harga" required>

                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori">
                        <option value="makanan">Makanan</option>
                        <option value="minuman">Minuman</option>
                        <option value="merchandise">Merchandise</option>
                        <option value="jasa">Jasa</option>
                    </select>

                    <label for="deskripsi">Deskripsi</label>
                    <textarea id="deskripsi" name="deskripsi" placeholder="Deskripsikan produk Anda"></textarea>

                    <label for="status">Status Penjualan</label>
                    <select id="status" name="status">
                        <option value="ready">Ready Stock</option>
                        <option value="po">Pre-Order</option>
                    </select>

                    <label for="stok-produk">Jumlah Stok</label>
                    <input type="number" id="stok-produk" name="stok-produk" min="0" placeholder="Masukkan jumlah stok">

                    <button type="submit">Simpan Produk</button>
                </form>
            </section>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 DanusHub. Dashboard Penjual Dana Usaha Mahasiswa.</p>
    </footer>
</body>
</html>
